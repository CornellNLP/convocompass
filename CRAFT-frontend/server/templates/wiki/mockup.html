{% extends "wiki/mockup_base.html" %}
{% block content %}
<div class="container" style="padding-top:10px; width:100%">
  <div class="row" style="width: 100%">
    <h3>Mockup Conversations</h3>
    <table class="table table-striped table-hover">
      {% for convo in convos %}
      <tr class="clickable-row" data-href="{{ url_for('wiki_mockup_routes.convo', id=convo, topic=None, hide_scores=1) }}">
	<td>Conversation {{ loop.index }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>
  <div class="row" style="width: 100%">
    <h3>Mockup Listings</h3>
    <table class="table table-striped table-hover">
      {% for t in listings %}
      <tr class="clickable-row" data-href="{{ url_for('wiki_mockup_routes.listing', t=t) }}">
	<td>Listing {{ loop.index }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>
</div>
{% endblock %}
