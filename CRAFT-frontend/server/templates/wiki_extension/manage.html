{% extends "shared/base.html" %}
{% block content %}
<div class="container" style="padding-top:10px; width:100%">
  <div class="row" style="width: 100%">
    <p>Add a participant to the study and randomly assign them to a group:</p>
  </div>
  <div class="row" style="width: 100%">
    <form action="{{ url_for('wiki_extension.add_user') }}" method="post">
      <label for='username'>Participant's usename:</label>
      <input type="input" name="username">
      <button type="submit" class="btn btn-secondary">Submit</button>
    </form>
  </div>
  <br>
  <div class="row" style="width: 100%">
    <h3> Existing participants </h3>
    <table class='table table-striped table-hover'>
      <tr><th>Username</th><th>Token</th><th>Enrolled</th></tr>
      {% for username,token,started in users %}
      <tr>
	<td>{{ username }}</td> <td>{{ token }}</td> <td>{{ format_time(started) }}</td>
      </tr>
      {% endfor %}
  </div>
</div>
{% endblock %}
